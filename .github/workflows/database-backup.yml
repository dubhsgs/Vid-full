name: Backup VAID Database Disabled

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled-github-artifact-backup:
    name: GitHub artifact database backup is disabled
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Explain disabled backup path
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::GitHub artifact database backups are disabled for VAID."
          echo "Use Vid-full-main/ops/db-backup/local-encrypted-db-backup.sh via the installed macOS LaunchAgent."
          echo "The active encrypted backup target is /Users/yan/Library/Application Support/VAID/backups."
          exit 1
